class_ids:
  normal: 0
  clear:  1

seg_classes:          # segmentation label order — do not change
  - pupil
  - iris
  - outer_arc

roi_classes:          # which seg classes contribute to the ROI mask
  - pupil
  - iris
  - outer_arc

data:
  train_dir: data/iris_contact/train
  val_dir:   data/iris_contact/val
  test_dir:  data/iris_contact/val

# ── Backbone ──────────────────────────────────────────────────────────────────
backbone:      convnext
convnext_type: convnext_base   # convnext_tiny | convnext_small | convnext_base | convnext_large
attn_stage:    2               # inject attention after ConvNeXt stage 0-3; null disables it

# ── Attention ─────────────────────────────────────────────────────────────────
attn_type:    spatial   # spatial | multihead | null
num_heads:    4         # only used when attn_type: multihead
se_reduction: 16        # SE channel-attention reduction ratio

# ── Training ──────────────────────────────────────────────────────────────────
epochs:          80
inp_dim:         [480, 640]
batch_size:      16
num_workers:     4
dropout_prob:    0.3

optimizer:       AdamW
weight_decay:    1.0e-4
criterion:       CrossEntropyLoss
label_smoothing: 0.05

lr_scheduler:
  type:      cosine
  lr:        0.0002
  eta_min:   1.0e-6
  step_size: 15    # legacy fallback for StepLR
  gamma:     0.1
